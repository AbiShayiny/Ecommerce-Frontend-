<div class="adm-page">
  <div class="page-head">
    <h1>Review &amp; Rating Moderation</h1>
    <p>Moderate buyer reviews and preserve valid electronics feedback.</p>
  </div>

  <div class="filters-bar card">
    <input type="search" placeholder="Search reviewer, product, or comment..." [ngModel]="search()" (ngModelChange)="search.set($event)" />
    <select [ngModel]="statusFilter()" (ngModelChange)="statusFilter.set($event)">
      <option value="all">All Statuses</option>
      <option value="Approved">Approved</option>
      <option value="Hidden">Hidden</option>
    </select>
  </div>

  <div class="reviews-list">
    @for (rev of filteredReviews(); track rev.id) {
      <article class="review-card card">
        <div class="rev-top">
          <div>
            <strong>{{ productName(rev.productId) }}</strong>
            <span>By {{ rev.buyerName }} • {{ rev.createdAt }}</span>
          </div>
          <app-status-badge [status]="rev.status" />
        </div>
        <app-rating-stars [rating]="rev.rating" />
        <p>{{ rev.comment }}</p>
        <div class="rev-actions">
          <button type="button" class="link-btn" (click)="catalog.setReviewStatus(rev.id, 'Approved')">Approve</button>
          <button type="button" class="link-btn" (click)="catalog.setReviewStatus(rev.id, 'Hidden')">Hide</button>
          <button type="button" class="del-btn" (click)="catalog.removeReview(rev.id)">Remove</button>
        </div>
      </article>
    }
  </div>
</div>
