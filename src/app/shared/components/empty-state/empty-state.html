<div class="empty-state card">
  <div class="empty-icon" aria-hidden="true">📦</div>
  <h3>{{ title() }}</h3>
  <p>{{ description() }}</p>
  @if (actionLabel()) {
    <button type="button" class="btn btn-primary btn-sm" (click)="actionClick.emit()">
      {{ actionLabel() }}
    </button>
  }
</div>
